name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 05번 문서 TC-01~14. 하나라도 깨지면 배포하지 않는다.
      - name: 과금 엔진 테스트
        run: npm run test:billing

      - run: npm test

      # 03번 스키마가 실제로 DDL 로 떨어지는지 본다.
      # DB 없이 검증되므로 CI 에서 붙일 수 있다.
      - name: DB 스키마 검증
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/hangyeol
        run: npx --yes prisma@5 validate --schema packages/db/prisma/schema.prisma

      - name: 강사 앱 빌드
        run: npm run build --workspace @hangyeol/teacher

      # 10번 문서 §3 — 학생 앱에 브랜드 문자열이 새면 빌드를 실패시킨다.
      # apps/note 가 생기기 전까지는 건너뛴다.
      - name: 화이트라벨 브랜드 문자열 검사
        run: |
          if [ ! -d apps/note ]; then
            echo "apps/note 미착수 — 검사 생략"
            exit 0
          fi
          if grep -rniE '한결|hangyeol' apps/note/src apps/note/app 2>/dev/null; then
            echo "::error::학생 앱에 브랜드 문자열이 있습니다 (10번 문서 §3)"
            exit 1
          fi
          echo "브랜드 문자열 없음"

      # 10번 문서 §4 — 학생 수에 비례하는 종량과금 API 가 새로 들어왔는지 본다.
      - name: 종량과금 API 추가 감지
        run: |
          HITS=$(grep -rniE 'speech-to-text|transcribe|synthesizeSpeech|textToSpeech|whisper' \
                 --include='*.ts' --include='*.tsx' packages apps tools 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::종량과금 API 로 보이는 호출이 있습니다. PR 설명에 근거를 적고 리뷰어 승인을 받으세요."
            exit 1
          fi
          echo "종량과금 API 없음"
